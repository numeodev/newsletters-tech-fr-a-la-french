name: Vérification des liens

on:
  schedule:
    - cron: "0 6 1 * *" # le 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les URLs des fiches
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,403,429 --exclude exemple.fr "newsletters/*.yml"
          fail: false
      - name: Ouvrir une issue si des liens sont cassés
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Liens morts détectés
          content-filepath: ./lychee/out.md
          labels: lien-mort
