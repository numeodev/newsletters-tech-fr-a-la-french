# Modèle de fiche : copiez ce fichier en `newsletters/<slug>.yml`
# (slug = nom en minuscules, sans accents, mots séparés par des tirets).
# Les fichiers commençant par `_` sont ignorés.

# Obligatoire
nom: Ma Newsletter
url: https://exemple.fr/newsletter
description: "Une phrase qui dit de quoi parle la newsletter (200 caractères max)."  # gardez les guillemets
thematiques: [dev, ia]      # 1 à 3 valeurs parmi thematiques.yml, dans UNE seule paire de crochets ; la première sert au classement
frequence: hebdomadaire     # quotidienne | hebdomadaire | bimensuelle | mensuelle | irreguliere

# Facultatif
auteur: Prénom Nom
gratuite: true              # false si l'accès est payant
# flux: https://exemple.fr/feed  # flux RSS/Atom, à décommenter seulement s'il n'est pas détecté automatiquement
